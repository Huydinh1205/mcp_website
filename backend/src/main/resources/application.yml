spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=marketplace;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Your_strong_Passw0rd}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    hikari:
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.globally_quoted_identifiers: true
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  confirm-secret: ${CONFIRM_TOKEN_SECRET:dev-only-confirm-secret-change-me}
  seller-mode: ${SELLER_MODE:server}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: warn
